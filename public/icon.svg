<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Glowing Amber Background -->
  <rect width="64" height="64" rx="16" fill="#08080c"/>
  <rect width="64" height="64" rx="16" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2"/>
  
  <!-- Outer Vinyl Rim -->
  <circle cx="32" cy="32" r="24" fill="#121218" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="19" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <circle cx="32" cy="32" r="14" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  
  <!-- Center Label Hub -->
  <circle cx="32" cy="32" r="9" fill="#f59e0b"/>
  
  <!-- Spindle / Cassette Spool Core -->
  <circle cx="32" cy="32" r="3" fill="#08080c" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Retro Spool Spokes -->
  <line x1="32" y1="23" x2="32" y2="26" stroke="#08080c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="32" y2="41" stroke="#08080c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="32" x2="26" y2="32" stroke="#08080c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="32" x2="41" y2="32" stroke="#08080c" stroke-width="1.5" stroke-linecap="round"/>
</svg>
